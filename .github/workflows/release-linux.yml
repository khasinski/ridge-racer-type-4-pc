name: Release Linux
run-name: ${{ inputs.dry_run && 'Dry run' || 'Release' }} ${{ inputs.version || github.ref_name }} (Linux)

# Builds the game for Linux x86-64 and ARM64 and attaches
# Ridge-Racer-Type-4-<version>-linux-<arch>.tar.gz and .AppImage to the
# release <version>. A manual rebuild runs on the tag itself, so the tag's
# own workflow and packaging/ scripts build it:
#   gh workflow run release-linux.yml --ref <version>
# dry_run builds and packages any ref without touching a release. See
# docs/RELEASING.md.

on:
  push:
    tags:
      - "[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (default the ref the run is on; must be that tag unless dry_run)
        required: false
        type: string
      dry_run:
        description: Build and package only; attach nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-linux-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  PSYZ_HEADLESS: "1"
  SDL_AUDIODRIVER: dummy

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check the ref
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          # The tag's own workflow and staging scripts build a release.
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != "refs/tags/$VERSION" ]; then
            echo "::error::Release $VERSION must run on its tag: gh workflow run release-linux.yml --ref $VERSION (this run is on $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DRR4_DIAGNOSTICS=OFF
      - name: Build
        run: cmake --build build/release --parallel 4
      - name: Unit tests (no game data)
        run: ctest --test-dir build/release --output-on-failure --no-tests=error
      - name: Package
        run: |
          set -euo pipefail
          package="Ridge-Racer-Type-4-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${package}"
          cp build/release/ridge-racer-type-4-pc "dist/${package}/"
          strip "dist/${package}/ridge-racer-type-4-pc"
          cp packaging/icon/ridge-racer-type-4.png "dist/${package}/"
          packaging/stage.sh "dist/${package}" build/release
          ldd build/release/ridge-racer-type-4-pc > "dist/${package}/runtime-dependencies.txt"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          tar -tzf "dist/${package}.tar.gz" > package-list.txt && grep -q "^${package}/ridge-racer-type-4-pc$" package-list.txt
          grep -q "^${package}/source-commit.txt$" package-list.txt
          grep -q "^${package}/licenses/libwebp/COPYING$" package-list.txt
          cat "dist/${package}/source-commit.txt"
          sha256sum "dist/${package}.tar.gz"
      - name: AppImage
        run: |
          set -euo pipefail
          package="Ridge-Racer-Type-4-${VERSION}-linux-${{ matrix.arch }}"
          packaging/linux/appimage.sh "dist/${package}" ${{ matrix.arch }} "dist/${package}.AppImage"
          # Starts without a disc and prints its usage (headless, no FUSE).
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/${package}.AppImage" > appimage-startup.log 2>&1 || true
          cat appimage-startup.log
          grep -q 'usage: ' appimage-startup.log
          "dist/${package}.AppImage" --appimage-extract > /dev/null
          for f in AppRun ridge-racer-type-4.desktop usr/bin/ridge-racer-type-4-pc \
                   usr/share/doc/ridge-racer-type-4/source-commit.txt \
                   usr/share/doc/ridge-racer-type-4/licenses/libwebp/COPYING; do
            test -e "squashfs-root/${f}" || { echo "missing ${f}" >&2; exit 1; }
          done
          rm -rf squashfs-root
          sha256sum "dist/${package}.AppImage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ridge-Racer-Type-4-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$VERSION" > /dev/null 2>&1 && break
            echo "Waiting for release $VERSION..."
            sleep 30
          done
          gh release upload "$VERSION" dist/*.tar.gz dist/*.AppImage --clobber
