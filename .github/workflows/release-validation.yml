name: Release validation (no publication)

# Builds, tests and packages exactly like the release workflows on all three
# platforms (the Linux tarball directory and AppImage), without signing secrets and without touching any release.
# Run it by hand before tagging, or let it run when packaging changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - packaging/**
      - .github/workflows/release-*.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - packaging/**
      - .github/workflows/release-*.yml

permissions:
  contents: read

env:
  VERSION: validation
  PSYZ_HEADLESS: "1"
  SDL_AUDIODRIVER: dummy

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DRR4_MACOS_BUNDLE=ON -DBUILD_TESTING=ON -DRR4_DIAGNOSTICS=OFF
          else
            cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DRR4_DIAGNOSTICS=OFF
          fi
      - name: Build
        run: cmake --build build/release --parallel 4
      - name: Unit tests (no game data)
        run: ctest --test-dir build/release --output-on-failure --no-tests=error
      - name: Package (unsigned)
        run: |
          set -euo pipefail
          package="Ridge-Racer-Type-4-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${package}"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto "build/release/Ridge Racer Type 4.app" "dist/${package}/Ridge Racer Type 4.app"
            codesign --force --sign - "dist/${package}/Ridge Racer Type 4.app"
            codesign --verify --deep --strict "dist/${package}/Ridge Racer Type 4.app"
            plutil -lint "dist/${package}/Ridge Racer Type 4.app/Contents/Info.plist"
            test -f "dist/${package}/Ridge Racer Type 4.app/Contents/Resources/RidgeRacerType4.icns"
            test -f "dist/${package}/Ridge Racer Type 4.app/Contents/Resources/licenses/libwebp/COPYING"
            packaging/stage.sh "dist/${package}" build/release --no-licenses
          else
            cp build/release/ridge-racer-type-4-pc packaging/icon/ridge-racer-type-4.png "dist/${package}/"
            packaging/stage.sh "dist/${package}" build/release
          fi
          test -f "dist/${package}/source-commit.txt"
          cat "dist/${package}/source-commit.txt"
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          package="Ridge-Racer-Type-4-${VERSION}-${{ matrix.name }}"
          arch="${{ matrix.name }}"
          packaging/linux/appimage.sh "dist/${package}" "${arch#linux-}" "dist/${package}.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/${package}.AppImage" > appimage-startup.log 2>&1 || true
          cat appimage-startup.log
          grep -q 'usage: ' appimage-startup.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.name }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2.27.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Fetch PsyZ and SDL
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DRR4_DIAGNOSTICS=OFF
      - name: Build
        run: cmake --build build/release --parallel 4
      - name: Unit tests (no game data)
        run: ctest --test-dir build/release --output-on-failure --no-tests=error
      - name: Package (unsigned)
        run: |
          set -euo pipefail
          package="Ridge-Racer-Type-4-${VERSION}-windows-x86_64-experimental"
          mkdir -p "dist/${package}"
          cp build/release/ridge-racer-type-4-pc.exe "dist/${package}/"
          strip "dist/${package}/ridge-racer-type-4-pc.exe"
          packaging/stage.sh "dist/${package}" build/release
          # Everything but Windows system DLLs is linked statically.
          objdump -p "dist/${package}/ridge-racer-type-4-pc.exe" | grep 'DLL Name'
          if objdump -p "dist/${package}/ridge-racer-type-4-pc.exe" | grep 'DLL Name' \
              | grep -viE 'DLL Name: (api-ms-win-|kernel32|user32|gdi32|shell32|ole32|oleaut32|advapi32|imm32|winmm|version|setupapi|cfgmgr32|hid|dinput8|xinput|dxgi|d3d|dwmapi|uxtheme|shcore|comdlg32|winspool|ws2_32|bcrypt|ntdll|msvcrt|ucrtbase)'; then
            echo "unexpected DLL dependency" >&2
            exit 1
          fi
          objdump -h "dist/${package}/ridge-racer-type-4-pc.exe" > package-sections.txt && grep -q '\.rsrc' package-sections.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-windows-x86_64
          path: dist/
          retention-days: 7
          if-no-files-found: error
