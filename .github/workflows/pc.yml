name: pc

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PSYZ_HEADLESS: "1"
  SDL_AUDIODRIVER: dummy

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build native target
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build --parallel
      - name: Unit tests (no game data)
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev clang mingw-w64-x86-64-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Host-flag and LLP64 (64-bit Windows) compile check
        run: CC=clang RR4_CHECK_LLP64=1 RR4_MINGW_SYSROOT=/usr tools/port/check.sh
      - name: Build native target
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
          cmake --build build --parallel
      - name: Unit tests (no game data)
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2.27.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Fetch PsyZ and SDL
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build native target
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: Unit tests and startup smoke (no game data)
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error
          ./build/ridge-racer-type-4-pc.exe 2>&1 | tee startup.log || true
          grep -q 'usage: ' startup.log
      # The whole suite, like the MSVC job: host files (memory cards, disc
      # images, UTF-8 paths) and the GPU tests on D3D12 (WARP) with a
      # hidden window.
      - name: PsyZ tests (MinGW, D3D12)
        env:
          CI: 1
          PSYZ_HEADLESS: gpu
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
          SDL_GPU_DRIVER: direct3d12
        run: |
          set -o pipefail
          cmake -S third_party/psyz/psyz/tests -B build/psyz-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psyz-tests --parallel 4
          cd third_party/psyz/psyz/tests
          ../../../../build/psyz-tests/psyz_tests.exe --verbose 2>&1 | tee mingw.log
          grep -q 'SDL_GPU with driver direct3d12' mingw.log
      - name: Upload PsyZ test failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mingw-failures
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            third_party/psyz/psyz/tests/mingw.log
          if-no-files-found: ignore

  # MSVC (cl.exe) keeps PsyZ free of GCC/Clang-only constructs: Parasite Eve
  # and PsyZ itself build it with Visual Studio. The PsyZ suite runs on the
  # D3D12 backend with a hidden window.
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 1
      PSYZ_HEADLESS: gpu
      SDL_VIDEODRIVER: offscreen
      SDL_AUDIO_DRIVER: dummy
      SDL_GPU_DRIVER: direct3d12
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Fetch PsyZ and SDL
        shell: bash
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build the PsyZ tests (MSVC x64)
        id: psyz_build
        shell: bash
        run: |
          cmake -S third_party/psyz/psyz/tests -B build/psyz-msvc -A x64
          cmake --build build/psyz-msvc --config Release --parallel 4
      - name: Build the game (MSVC x64)
        id: game_build
        if: success() || failure()
        timeout-minutes: 25
        shell: bash
        run: |
          cmake -S . -B build/msvc -A x64 -DBUILD_TESTING=ON
          cmake --build build/msvc --config Release --parallel 4 -- -m -v:minimal 2>&1 | tee msvc-build.log
          test "${PIPESTATUS[0]}" = 0
      - name: PsyZ tests (MSVC)
        if: (success() || failure()) && steps.psyz_build.outcome == 'success'
        shell: bash
        working-directory: third_party/psyz/psyz/tests
        timeout-minutes: 20
        run: ../../../../build/psyz-msvc/Release/psyz_tests.exe
      - name: Game tests (MSVC)
        if: (success() || failure()) && steps.game_build.outcome == 'success'
        shell: bash
        run: ctest --test-dir build/msvc -C Release --output-on-failure --no-tests=error
        env:
          PSYZ_HEADLESS: "1"
          SDL_AUDIODRIVER: dummy
      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-failures
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            msvc-build.log
          if-no-files-found: ignore

  # The shader headers PsyZ compiles in are rebuilt from their GLSL and must
  # come out byte for byte as committed (check_shaders.cmake only compares
  # the GLSL hashes they record, in every format, at configure time).
  # SPIR-V and MSL here; DXIL, which needs the Windows SDK's dxc, in
  # shaders-dxil.
  shaders:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Fetch PsyZ
        run: git submodule update --init third_party/psyz
      - name: Install glslang and SPIRV-Cross
        run: |
          brew install glslang spirv-cross
          glslangValidator --version | head -1
          spirv-cross --revision
      - name: Rebuild the SPIR-V and MSL headers
        working-directory: third_party/psyz/psyz/src/platform/shaders
        run: |
          SKIP_DXIL=1 sh build_shaders.sh
          git status --short .
          git diff --stat --exit-code -- '*_spv.h' '*_msl.h'

  shaders-dxil:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2.27.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            vim
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-cross
      - name: Fetch PsyZ
        shell: bash
        run: git submodule update --init third_party/psyz
      - name: Rebuild the DXIL headers
        shell: msys2 {0}
        run: |
          set -eu
          git config --global --add safe.directory '*'
          dxc_dir=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          export PATH="$dxc_dir:$PATH"
          dxc --version || true
          glslangValidator --version | head -1
          spirv-cross --revision
          cd third_party/psyz/psyz/src/platform/shaders
          sh build_shaders.sh
          git status --short .
          git diff --stat --exit-code -- '*_dxil.h'
