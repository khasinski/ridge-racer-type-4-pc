name: GPU backends

# Runs PsyZ's GPU tests on every SDL_GPU backend a release ships, with
# software GPUs the hosted runners have: Vulkan on lavapipe (Linux), D3D12 on
# WARP (Windows, MinGW like the release) and Metal (macOS, with and without
# framebuffer fetch). The golden-image gpu::* tests and
# gpu::sdl_gpu_rasterizer_matches_cpu_rasterizer_at_every_scale (random
# primitive streams drawn by the GPU rasterizer at 1x..4x against the CPU
# rasterizer, full and decimated) must pass on each, and the log must name
# the backend that drew them. The CPU rasterizer (PSYZ_HEADLESS=1) runs the
# same gpu::* tests and must pass them all except CPU_KNOWN_FAILURES, which
# are run on their own and reported (a notice) once they pass, so the list
# can shrink. Failed golden images are uploaded.
#
# Without an SDL GPU device (Linux without a Vulkan driver, forced on macOS
# with PSYZ_GPU=off) PsyZ falls back to the CPU rasterizer presented by an
# SDL renderer: the no-vulkan job and the last Metal steps run the gpu::*
# tests that way (all but CPU_KNOWN_FAILURES) and check the log names the
# fallback. The Metal job also runs the gpu::* tests without framebuffer
# fetch (PSYZ_GPU_FETCH=0, the copy path of D3D12 and Vulkan) and checks
# each log names the blend path it tested.
#
# The game itself needs a disc image, so it is only built here; game frames
# are compared on a developer machine (RR4_CAPTURE_AT with PSYZ_HEADLESS=1
# and PSYZ_HEADLESS=gpu, see src/port/main.c).

on:
  workflow_dispatch:
    inputs:
      refs:
        description: JSON list of refs to test (tags, branches or commits)
        required: false
        default: '["main"]'
        type: string

permissions:
  contents: read

env:
  SDL_AUDIODRIVER: dummy
  SDL_AUDIO_DRIVER: dummy
  CI: 1
  # gpu::* tests that fail on the CPU rasterizer (docs/TECH_DEBT.md P9): the
  # crop test asks for its own SDL_GPU device, move_image_internal_res needs
  # the GPU rasterizer's internal resolution.
  CPU_KNOWN_FAILURES: >-
    gpu::presentation_crop_is_stable_across_field_buffers,gpu::move_image_internal_res

jobs:
  vulkan-lavapipe:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL_VIDEODRIVER: offscreen
      SDL_GPU_DRIVER: vulkan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}
          submodules: false
      - name: Install dependencies (SDL, lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | grep -iE 'deviceName|driverName' || true
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
          git -C third_party/psyz log --oneline -1
      - name: Build the game (release configuration)
        run: |
          cmake -S . -B build/game -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/game --parallel 4
      - name: Build the PsyZ tests
        run: |
          cmake -S third_party/psyz/psyz/tests -B build/psyz-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psyz-tests --parallel 4
      - name: PsyZ tests on Vulkan (lavapipe)
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: gpu
        run: |
          set -o pipefail
          ../../../../build/psyz-tests/psyz_tests --verbose 2>&1 | tee vulkan.log
          grep -q 'SDL_GPU with driver vulkan' vulkan.log
      - name: gpu tests on the CPU rasterizer (all but the known failures)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: "1"
        run: |
          set -o pipefail
          exclude=$(printf '%s' "$CPU_KNOWN_FAILURES" | tr -d ' ' | sed 's/^/-/; s/,/,-/g')
          ../../../../build/psyz-tests/psyz_tests --verbose "--filter=gpu::*,${exclude}" 2>&1 | tee cpu.log
      - name: Known CPU rasterizer failures (reported, not gating)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: "1"
        run: |
          for t in $(printf '%s' "$CPU_KNOWN_FAILURES" | tr ',' ' '); do
            if ../../../../build/psyz-tests/psyz_tests --verbose "--filter=$t" >> cpu-known.log 2>&1; then
              echo "::notice::$t passes on the CPU rasterizer now; remove it from CPU_KNOWN_FAILURES."
            else
              echo "$t: still fails (known)"
            fi
          done
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulkan-${{ strategy.job-index }}
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            third_party/psyz/psyz/tests/*.log
          if-no-files-found: ignore

  # No Vulkan driver (no ICD installed): SDL_CreateGPUDevice fails and PsyZ
  # falls back to the CPU rasterizer presented by an SDL renderer.
  no-vulkan:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL_VIDEODRIVER: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}
          submodules: false
      - name: Install dependencies (SDL, no Vulkan driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev
          sudo apt-get remove -y mesa-vulkan-drivers || true
          ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
          git -C third_party/psyz log --oneline -1
      - name: Build the game (release configuration)
        run: |
          cmake -S . -B build/game -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/game --parallel 4
      - name: Build the PsyZ tests
        run: |
          cmake -S third_party/psyz/psyz/tests -B build/psyz-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psyz-tests --parallel 4
      - name: gpu tests without a Vulkan driver (the CPU rasterizer fallback)
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: gpu
          VK_ICD_FILENAMES: /nonexistent.json
          VK_DRIVER_FILES: /nonexistent.json
        run: |
          set -o pipefail
          exclude=$(printf '%s' "$CPU_KNOWN_FAILURES" | tr -d ' ' | sed 's/^/-/; s/,/,-/g')
          ../../../../build/psyz-tests/psyz_tests --verbose "--filter=gpu::*,${exclude}" 2>&1 | tee fallback.log
          grep -q 'no SDL GPU device (SDL_CreateGPUDevice' fallback.log
          grep -q 'CPU rasterizer, presented by SDL renderer' fallback.log
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: no-vulkan-${{ strategy.job-index }}
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            third_party/psyz/psyz/tests/*.log
          if-no-files-found: ignore

  d3d12-warp:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs) }}
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    env:
      SDL_VIDEODRIVER: offscreen
      SDL_GPU_DRIVER: direct3d12
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}
          submodules: false
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2.27.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Fetch PsyZ and SDL
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
          git -C third_party/psyz log --oneline -1
      - name: Build the game (release configuration)
        run: |
          cmake -S . -B build/game -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/game --parallel 4
      - name: Build the PsyZ tests
        run: |
          cmake -S third_party/psyz/psyz/tests -B build/psyz-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psyz-tests --parallel 4
      - name: PsyZ tests on D3D12 (WARP)
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: gpu
        run: |
          set -o pipefail
          ../../../../build/psyz-tests/psyz_tests.exe --verbose 2>&1 | tee d3d12.log
          grep -q 'SDL_GPU with driver direct3d12' d3d12.log
      - name: gpu tests on the CPU rasterizer (all but the known failures)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: "1"
        run: |
          set -o pipefail
          exclude=$(printf '%s' "$CPU_KNOWN_FAILURES" | tr -d ' ' | sed 's/^/-/; s/,/,-/g')
          ../../../../build/psyz-tests/psyz_tests.exe --verbose "--filter=gpu::*,${exclude}" 2>&1 | tee cpu.log
      - name: Known CPU rasterizer failures (reported, not gating)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: "1"
        run: |
          for t in $(printf '%s' "$CPU_KNOWN_FAILURES" | tr ',' ' '); do
            if ../../../../build/psyz-tests/psyz_tests.exe --verbose "--filter=$t" >> cpu-known.log 2>&1; then
              echo "::notice::$t passes on the CPU rasterizer now; remove it from CPU_KNOWN_FAILURES."
            else
              echo "$t: still fails (known)"
            fi
          done
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d3d12-${{ strategy.job-index }}
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            third_party/psyz/psyz/tests/*.log
          if-no-files-found: ignore

  metal:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs) }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}
          submodules: false
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
          git -C third_party/psyz log --oneline -1
      - name: Build the game (release configuration)
        run: |
          cmake -S . -B build/game -DCMAKE_BUILD_TYPE=Release
          cmake --build build/game --parallel 4
      - name: Build the PsyZ tests
        run: |
          cmake -S third_party/psyz/psyz/tests -B build/psyz-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psyz-tests --parallel 4
      - name: PsyZ tests on Metal
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: gpu
        run: |
          set -o pipefail
          ../../../../build/psyz-tests/psyz_tests --verbose 2>&1 | tee metal.log
          grep -q 'SDL_GPU with driver metal' metal.log
          grep -q 'SDL_GPU semi-transparency: framebuffer fetch' metal.log
      - name: gpu tests on Metal without framebuffer fetch (the copy path of D3D12 and Vulkan)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: gpu
          PSYZ_GPU_FETCH: "0"
        run: |
          set -o pipefail
          ../../../../build/psyz-tests/psyz_tests --verbose '--filter=gpu::*' 2>&1 | tee metal-copy.log
          grep -q 'SDL_GPU semi-transparency: target copies' metal-copy.log
      - name: gpu tests without an SDL GPU device (PSYZ_GPU=off, the CPU rasterizer fallback)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: gpu
          PSYZ_GPU: "off"
        run: |
          set -o pipefail
          exclude=$(printf '%s' "$CPU_KNOWN_FAILURES" | tr -d ' ' | sed 's/^/-/; s/,/,-/g')
          ../../../../build/psyz-tests/psyz_tests --verbose "--filter=gpu::*,${exclude}" 2>&1 | tee fallback.log
          grep -q 'no SDL GPU device (turned off by PSYZ_GPU=off)' fallback.log
          grep -q 'CPU rasterizer, presented by SDL renderer' fallback.log
      - name: gpu tests on the CPU rasterizer (all but the known failures)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: "1"
        run: |
          set -o pipefail
          exclude=$(printf '%s' "$CPU_KNOWN_FAILURES" | tr -d ' ' | sed 's/^/-/; s/,/,-/g')
          ../../../../build/psyz-tests/psyz_tests --verbose "--filter=gpu::*,${exclude}" 2>&1 | tee cpu.log
      - name: Known CPU rasterizer failures (reported, not gating)
        if: success() || failure()
        working-directory: third_party/psyz/psyz/tests
        env:
          PSYZ_HEADLESS: "1"
        run: |
          for t in $(printf '%s' "$CPU_KNOWN_FAILURES" | tr ',' ' '); do
            if ../../../../build/psyz-tests/psyz_tests --verbose "--filter=$t" >> cpu-known.log 2>&1; then
              echo "::notice::$t passes on the CPU rasterizer now; remove it from CPU_KNOWN_FAILURES."
            else
              echo "$t: still fails (known)"
            fi
          done
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metal-${{ strategy.job-index }}
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            third_party/psyz/psyz/tests/*.log
          if-no-files-found: ignore
